# SYDT Chat — örnek Nginx ters vekil yapılandırması
# Tek genel origin (önerilen): https://sydt.kurum.local
# WebSocket (Socket.IO) yükseltmesi zorunludur.

upstream sydt_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream sydt_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# HTTP → HTTPS yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name sydt.kurum.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sydt.kurum.local;

    # Kurum sertifikası yollarını güncelleyin
    ssl_certificate     /etc/ssl/certs/sydt.kurum.local.crt;
    ssl_certificate_key /etc/ssl/private/sydt.kurum.local.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    # API doğrudan (Next rewrite yerine tercih edilebilir)
    location /api/ {
        proxy_pass http://sydt_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Socket.IO — WebSocket zorunlu
    location /socket.io/ {
        proxy_pass http://sydt_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Sağlık kontrolü (doğrudan API)
    location = /health {
        proxy_pass http://sydt_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Web arayüzü
    location / {
        proxy_pass http://sydt_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
